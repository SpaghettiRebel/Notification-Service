services:
  notification_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_DB: ${DB_NAME:-notification_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    restart: always
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10

  notification_service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    volumes:
      - ./notification_service:/app/notification_service
    environment:
      DB_HOST: ${DB_HOST:-notification_db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-user}
      DB_PASS: ${DB_PASS:-password}
      DB_NAME: ${DB_NAME:-notification_db}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_DELIVERY_TIMEOUT_MS: ${KAFKA_DELIVERY_TIMEOUT_MS:-10000}
      KAFKA_MAX_POLL_INTERVAL_MS: ${KAFKA_MAX_POLL_INTERVAL_MS:-180000}
      PROCESSING_LEASE_SECONDS: ${PROCESSING_LEASE_SECONDS:-60}
      SENDER_MAX_ATTEMPTS: ${SENDER_MAX_ATTEMPTS:-3}
      SENDER_ATTEMPT_TIMEOUT_SECONDS: ${SENDER_ATTEMPT_TIMEOUT_SECONDS:-10}
      SENDER_RETRY_MIN_SECONDS: ${SENDER_RETRY_MIN_SECONDS:-1}
      SENDER_RETRY_MAX_SECONDS: ${SENDER_RETRY_MAX_SECONDS:-5}
    depends_on:
      notification_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m notification_service.worker"

  public_api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: public_api/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./public_api:/app/public_api
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_DELIVERY_TIMEOUT_MS: ${KAFKA_DELIVERY_TIMEOUT_MS:-10000}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    command: >
      sh -c "uvicorn public_api.main:app --host 0.0.0.0 --port 8001"

volumes:
  notification_postgres_data:
